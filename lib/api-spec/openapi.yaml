openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Gestoría Canarias — Boletines Oficiales
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: entries
    description: Boletín entry operations
  - name: sync
    description: Manual sync operations
  - name: stats
    description: Dashboard statistics
  - name: alerts
    description: Category alert management
  - name: clients
    description: Client management
  - name: matches
    description: Entry-client match management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List boletín entries
      description: List entries from BOE, BOC and BOP with optional filters
      parameters:
        - name: source
          in: query
          description: Filter by bulletin source (BOE, BOC, BOP_LPA, BOP_TFE)
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
        - name: date
          in: query
          description: Filter by publication date (YYYY-MM-DD)
          schema:
            type: string
        - name: search
          in: query
          description: Full-text search in title and summary
          schema:
            type: string
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryList"

  /entries/{id}:
    get:
      operationId: getEntry
      tags: [entries]
      summary: Get a single boletín entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found

  /entries/{id}/read:
    patch:
      operationId: markEntryRead
      tags: [entries]
      summary: Mark an entry as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"

  /entries/{id}/bookmark:
    patch:
      operationId: toggleBookmark
      tags: [entries]
      summary: Toggle bookmark on an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"

  /sync:
    post:
      operationId: triggerSync
      tags: [sync]
      summary: Manually trigger a sync of all bulletins
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      summary: Get the last sync status and timestamp
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Dashboard summary stats
      description: Total entries, unread count, entries per source, today's new entries
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/recent:
    get:
      operationId: getRecentEntries
      tags: [stats]
      summary: Most recent entries across all sources
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"

  /stats/categories:
    get:
      operationId: getCategoryBreakdown
      tags: [stats]
      summary: Count of entries grouped by category
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryCount"

  /entries/{id}/notes:
    get:
      operationId: listEntryNotes
      tags: [entries]
      summary: List notes for an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createEntryNote
      tags: [entries]
      summary: Create a note for an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteBody"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /entries/{id}/notes/{noteId}:
    patch:
      operationId: updateEntryNote
      tags: [entries]
      summary: Update a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteBody"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    delete:
      operationId: deleteEntryNote
      tags: [entries]
      summary: Delete a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List all configured category alerts
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create a new category alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertBody"
      responses:
        "201":
          description: Alert created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "400":
          description: Bad request

  /alerts/{id}:
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete a category alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /alerts/matches:
    get:
      operationId: getAlertMatches
      tags: [alerts]
      summary: Get today's entries that match any configured alert
      responses:
        "200":
          description: Matching entries with their alert
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertMatch"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      parameters:
        - name: active
          in: query
          description: Filter by active status
          schema:
            type: boolean
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientBody"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Bad request

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /entries/{id}/matches:
    get:
      operationId: listEntryMatches
      tags: [matches]
      summary: List client matches for an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of client matches for the entry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntryClientMatchWithClient"
    post:
      operationId: createEntryMatch
      tags: [matches]
      summary: Create a client match for an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchBody"
      responses:
        "201":
          description: Match created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryClientMatch"
        "400":
          description: Bad request

  /entries/{id}/matches/{matchId}:
    patch:
      operationId: updateEntryMatch
      tags: [matches]
      summary: Update a client match (e.g. mark as reviewed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewed:
                  type: boolean
                relevanceScore:
                  type: integer
                  minimum: 1
                  maximum: 3
                reason:
                  type: string
      responses:
        "200":
          description: Updated match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryClientMatch"
        "404":
          description: Not found
    delete:
      operationId: deleteEntryMatch
      tags: [matches]
      summary: Delete a client match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Entry:
      type: object
      required:
        - id
        - source
        - title
        - publishedAt
        - url
        - isRead
        - isBookmarked
        - createdAt
      properties:
        id:
          type: integer
        source:
          type: string
          enum: [BOE, BOC, BOP_LPA, BOP_TFE, BORME]
          description: "BOE, BOC, BOP_LPA, BOP_TFE, or BORME"
        title:
          type: string
        summary:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        publishedAt:
          type: string
          format: date
        url:
          type: string
        isRead:
          type: boolean
        isBookmarked:
          type: boolean
        createdAt:
          type: string
          format: date-time

    EntryList:
      type: object
      required:
        - entries
        - total
        - page
        - limit
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    SyncResult:
      type: object
      required:
        - success
        - message
        - newEntries
      properties:
        success:
          type: boolean
        message:
          type: string
        newEntries:
          type: integer
        sources:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              count:
                type: integer
              success:
                type: boolean

    SyncStatus:
      type: object
      required:
        - lastSyncAt
        - isRunning
      properties:
        lastSyncAt:
          type: ["string", "null"]
        isRunning:
          type: boolean
        lastResult:
          type: ["string", "null"]
        scheduledTime:
          type: string
          description: "Cron schedule expression"

    StatsSummary:
      type: object
      required:
        - totalEntries
        - unreadCount
        - todayCount
        - bookmarkedCount
        - bySource
      properties:
        totalEntries:
          type: integer
        unreadCount:
          type: integer
        todayCount:
          type: integer
        bookmarkedCount:
          type: integer
        bySource:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              count:
                type: integer

    CategoryCount:
      type: object
      required:
        - category
        - count
      properties:
        category:
          type: string
        count:
          type: integer

    Alert:
      type: object
      required:
        - id
        - category
        - createdAt
      properties:
        id:
          type: integer
        category:
          type: string
        source:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CreateAlertBody:
      type: object
      required:
        - category
      properties:
        category:
          type: string
        source:
          type: string

    AlertMatch:
      type: object
      required:
        - alert
        - entries
      properties:
        alert:
          $ref: "#/components/schemas/Alert"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"

    Note:
      type: object
      required:
        - id
        - entryId
        - content
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        entryId:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateNoteBody:
      type: object
      required:
        - content
      properties:
        content:
          type: string

    Client:
      type: object
      required:
        - id
        - name
        - active
        - bormeMonitored
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        nif:
          type: ["string", "null"]
          description: "NIF (personas físicas) o CIF (personas jurídicas)"
        nifType:
          type: string
          enum: [nif, cif]
          nullable: true
        bormeMonitored:
          type: boolean
        type:
          type: string
          enum: [autonomo, sl, sa, asociacion, comunidad_propietarios, otro]
          nullable: true
        cnae:
          type: ["string", "null"]
        municipality:
          type: ["string", "null"]
        taxRegime:
          type: string
          enum: [modulos, estimacion_directa, estimacion_directa_simplificada, otro]
          nullable: true
        keywords:
          type: array
          items:
            type: string
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateClientBody:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        nif:
          type: string
          description: "NIF/NIE/CIF español válido — se infiere nif_type automáticamente"
        type:
          type: string
          enum: [autonomo, sl, sa, asociacion, comunidad_propietarios, otro]
        cnae:
          type: string
        municipality:
          type: string
        taxRegime:
          type: string
          enum: [modulos, estimacion_directa, estimacion_directa_simplificada, otro]
        keywords:
          type: array
          items:
            type: string
        active:
          type: boolean
        bormeMonitored:
          type: boolean

    UpdateClientBody:
      type: object
      properties:
        name:
          type: string
        nif:
          type: string
          description: "NIF/NIE/CIF español válido — se infiere nif_type automáticamente"
        type:
          type: string
          enum: [autonomo, sl, sa, asociacion, comunidad_propietarios, otro]
        cnae:
          type: string
        municipality:
          type: string
        taxRegime:
          type: string
          enum: [modulos, estimacion_directa, estimacion_directa_simplificada, otro]
        keywords:
          type: array
          items:
            type: string
        active:
          type: boolean
        bormeMonitored:
          type: boolean

    EntryClientMatch:
      type: object
      required:
        - id
        - entryId
        - clientId
        - relevanceScore
        - matchedBy
        - reviewed
        - createdAt
      properties:
        id:
          type: integer
        entryId:
          type: integer
        clientId:
          type: integer
        relevanceScore:
          type: integer
          minimum: 1
          maximum: 3
        reason:
          type: ["string", "null"]
        matchedBy:
          type: string
          enum: [rules, ai]
        reviewed:
          type: boolean
        createdAt:
          type: string
          format: date-time

    EntryClientMatchWithClient:
      type: object
      required:
        - id
        - entryId
        - clientId
        - relevanceScore
        - matchedBy
        - reviewed
        - createdAt
        - client
      properties:
        id:
          type: integer
        entryId:
          type: integer
        clientId:
          type: integer
        relevanceScore:
          type: integer
          minimum: 1
          maximum: 3
        reason:
          type: ["string", "null"]
        matchedBy:
          type: string
          enum: [rules, ai]
        reviewed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        client:
          $ref: "#/components/schemas/Client"

    CreateMatchBody:
      type: object
      required:
        - clientId
        - relevanceScore
        - matchedBy
      properties:
        clientId:
          type: integer
        relevanceScore:
          type: integer
          minimum: 1
          maximum: 3
        reason:
          type: string
        matchedBy:
          type: string
          enum: [rules, ai]
