kind = "web"
previewPath = "/"
title = "Gestoría Canarias — Boletines Oficiales"
version = "1.0.0"
id = "artifacts/gestoria-canarias"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20210

[services.development]
run = "pnpm --filter @workspace/gestoria-canarias run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gestoria-canarias", "run", "build" ]
publicDir = "artifacts/gestoria-canarias/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20210"
BASE_PATH = "/"
