name: Read-only portfolio demo

on:
  push:
    branches:
      - "feat/read-only-portfolio-demo-2026-10"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: "20210"
      BASE_PATH: "/"
      VITE_PORTFOLIO_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Test synthetic dataset and deterministic relevance filters
        run: node --experimental-strip-types --test artifacts/gestoria-canarias/src/demo/fixtures.test.mjs
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck complete workspace
        run: pnpm run typecheck
      - name: Build public static portfolio demo
        run: pnpm --filter @workspace/gestoria-canarias run build
      - name: Verify built output contains demo and no sensitive fixtures
        run: node artifacts/gestoria-canarias/scripts/verify-demo-build.mjs
      - name: Upload static demo for manual preview
        uses: actions/upload-artifact@v4
        with:
          name: gestoria-canarias-read-only-demo
          path: artifacts/gestoria-canarias/dist/public/
          if-no-files-found: error
          retention-days: 14
