name: Publish safe static portfolio demo

on:
  push:
    branches:
      - main
    paths:
      - "artifacts/gestoria-canarias/**"
      - ".github/workflows/deploy-portfolio-pages.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: "20210"
      BASE_PATH: "/boletines-oficiales/"
      VITE_PORTFOLIO_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build only the read-only static frontend
        run: pnpm --filter @workspace/gestoria-canarias run build
      - name: Verify static demo and GitHub Pages asset base
        run: |
          node artifacts/gestoria-canarias/scripts/verify-demo-build.mjs
          grep -q "/boletines-oficiales/assets/" artifacts/gestoria-canarias/dist/public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/gestoria-canarias/dist/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish static files only
        id: deployment
        uses: actions/deploy-pages@v4
